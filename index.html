<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torn Gym Optimizer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
--bg:#0f1115;
--card:#1a1f2b;
--accent:#5da8ff;
--text:#e6e9ef;
--muted:#9aa4b2;
--success:#4cd964;
--danger:#ff5d5d;
}

body {
margin:0;
font-family:-apple-system;
background:var(--bg);
color:var(--text);
display:flex;
justify-content:center;
}

.container {
max-width:520px;
width:100%;
padding:16px;
}

h1 { text-align:center; }

input, button {
width:100%;
padding:10px;
border:none;
border-radius:10px;
margin-bottom:8px;
background:var(--card);
color:white;
}

button { background:var(--accent); cursor:pointer; }

.input-group { position:relative; }

.toggle {
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
font-size:12px;
cursor:pointer;
color:var(--muted);
}

.card {
background:var(--card);
padding:14px;
border-radius:12px;
margin-top:10px;
}

.row {
display:flex;
justify-content:space-between;
padding:5px 0;
}

.section { margin-top:12px; }

.timeline {
position:relative;
padding-left:25px;
}

.timeline::before {
content:"";
position:absolute;
left:10px;
top:0;
bottom:0;
width:2px;
background:var(--accent);
}

.item { margin-bottom:15px; position:relative; }

.dot {
position:absolute;
left:-3px;
top:3px;
width:12px;
height:12px;
border-radius:50%;
border:2px solid var(--accent);
background:var(--bg);
}

.content { padding-left:14px; font-size:13px; }

.jump { color:var(--success); }
.xanax { color:var(--accent); }
.waste { color:var(--danger); font-size:12px; }

canvas { margin-top:10px; }

</style>
</head>

<body>

<div class="container">

<h1>Gym Optimizer</h1>

<div class="input-group">
<input id="apiKey" type="password" placeholder="API Key">
<span class="toggle" onclick="toggleKey()">Show</span>
</div>

<input id="sleepStart" type="number" value="0">
<input id="sleepEnd" type="number" value="8">

<button onclick="load()">Optimize</button>

<div id="card" class="card" style="display:none">

<div class="row"><span>Energy</span><span id="energy"></span></div>
<div class="row"><span>Final Jump</span><span id="finalJump"></span></div>
<div class="row"><span>Strategy</span><span id="strategy"></span></div>

<div class="section"><b>Timeline</b></div>
<div id="timeline" class="timeline"></div>

<div class="section"><b>Energy vs Time</b></div>
<canvas id="chart"></canvas>

</div>

</div>

<script>

const XANAX_ENERGY = 250;
const MAX_ENERGY = 1000;
const XANAX_CD = 480 * 60;

let dataStore;
let chart;

// toggle key
function toggleKey(){
let k=apiKey;
k.type = k.type === "password" ? "text" : "password";
}

// helpers
function date(ts){ return new Date(ts).toLocaleTimeString(); }

function inSleep(ts){
let h=new Date(ts).getHours();
return h>=sleepStart.value && h<sleepEnd.value;
}

function shift(ts){
let d=new Date(ts);
d.setHours(sleepEnd.value,0,0,0);
return d.getTime();
}

// simulate
function simulate(strategy){

let now=Date.now();
let energy=dataStore.energy;
let time=now;
let steps=[];
let waste=0;

while(energy<MAX_ENERGY){

let take=true;

if(strategy!=="aggressive"){

let bestWait=0;
let bestWaste=999;

for(let i=0;i<=3;i++){
let future=energy+(i*dataStore.increment);
let raw=future+250;
let w=Math.max(0,raw-1000);

if(w<bestWaste){
bestWaste=w;
bestWait=i;
}
}

if(bestWait>0){
let waitTime=bestWait*dataStore.interval*1000;

if(strategy==="efficient" || waitTime < XANAX_CD*1000){
take=false;
time+=waitTime;
energy+=bestWait*dataStore.increment;
continue;
}
}
}

if(inSleep(time)) time=shift(time);

let raw=energy+250;
let after=Math.min(1000,raw);
let w=Math.max(0,raw-1000);

steps.push({time,energy:after,waste:w});
waste+=w;

energy=after;
time+=XANAX_CD*1000;
}

let final=Math.max(time,
Date.now()+dataStore.drug*1000,
Date.now()+dataStore.booster*1000);

return {steps, final, waste, strategy};
}

// optimizer
function calculateAll(){
return ["aggressive","balanced","efficient"].map(simulate);
}

// chart
function drawChart(results){

let datasets=[];

// generate curves
results.forEach(r=>{

let data=[];
let energy=dataStore.energy;
let time=Date.now();

data.push({x:time,y:energy});

r.steps.forEach(s=>{
data.push({x:s.time,y:s.energy});
});

datasets.push({
label:r.strategy,
data,
borderWidth: r.strategy==="efficient"?3:1,
borderColor:
r.strategy==="aggressive"?"#ff5d5d":
r.strategy==="balanced"?"#ffaa00":"#4cd964",
tension:0.3
});
});

// sleep zones plugin
const sleepPlugin = {
id:'sleepZones',
beforeDraw(chart){

let ctx=chart.ctx;
let xScale=chart.scales.x;

for(let i=0;i<48;i++){

let t1=Date.now()+i*3600000;
let t2=t1+3600000;

if(inSleep(t1)){
let x1=xScale.getPixelForValue(t1);
let x2=xScale.getPixelForValue(t2);

ctx.fillStyle="rgba(255,255,255,0.03)";
ctx.fillRect(x1,0,x2-x1,chart.height);
}
}
}
};

if(chart) chart.destroy();

chart=new Chart(document.getElementById("chart"),{
type:"line",
data:{datasets},
options:{
parsing:false,
scales:{
x:{type:"time", ticks:{color:"#9aa4b2"}},
y:{min:0,max:1000, ticks:{color:"#9aa4b2"}}
},
plugins:{legend:{labels:{color:"#9aa4b2"}}}
},
plugins:[sleepPlugin]
});
}

// UI
function render(){

let results=calculateAll();
results.sort((a,b)=>a.final-b.final || a.waste-b.waste);

let best=results[0];

energy.textContent=dataStore.energy;
finalJump.textContent=date(best.final);
strategy.textContent=best.strategy;

// timeline
let events=[];

best.steps.forEach((s,i)=>{
events.push({time:s.time,text:`💊 Xanax ${i+1}`,w:s.waste});
});

let jt=best.final;
for(let i=0;i<3;i++){
events.push({time:jt,text:`🏋️ Jump ${i+1}`});
jt+=86400000;
}

events.sort((a,b)=>a.time-b.time);

let html="";
events.forEach(e=>{
html+=`
<div class="item">
<div class="dot"></div>
<div class="content">
<b>${date(e.time)}</b>
<div>${e.text}</div>
${e.w>0?`<div class="waste">⚠️ ${e.w}</div>`:""}
</div>
</div>`;
});

timeline.innerHTML=html;

// chart
drawChart(results);
}

// load
async function load(){

let key=apiKey.value;

let res=await fetch(`https://api.torn.com/user/?selections=cooldowns,energy&key=${key}`);
let d=await res.json();

dataStore={
energy:d.energy.current,
drug:d.cooldowns.drug,
booster:d.cooldowns.booster,
increment:d.energy.increment,
interval:d.energy.interval
};

card.style.display="block";
render();
}

</script>

</body>
</html>
