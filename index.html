<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torn Advanced Planner & API Optimizer</title>

<style>
:root {
    --bg-main: #0f172a;
    --bg-card: #1e293b;
    --bg-input: #334155;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #22c55e;
    --danger: #ef4444;
    --warning: #eabc54;
    --info: #3b82f6;
    --border: #475569;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    padding: 24px;
    margin: 0;
}

.container {
    max-width: 1400px;
    margin: auto;
}

h2 {
    margin-top: 0;
    font-weight: 700;
    letter-spacing: -0.05em;
    border-bottom: 2px solid var(--border);
    padding-bottom: 12px;
}

.dashboard {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
}

@media (max-width: 1000px) {
    .dashboard { grid-template-columns: 1fr; }
}

.card {
    background: var(--bg-card);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    height: fit-content;
    margin-bottom: 16px;
}

.card-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text-main);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.form-group {
    margin-bottom: 12px;
}

label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

input, select {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: #fff;
    box-sizing: border-box;
    font-size: 14px;
}

input:focus, select:focus {
    outline: 2px solid var(--accent);
}

.btn-primary {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    background: var(--accent);
    color: #0f172a;
    border: none;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s;
}

    padding: 8px
