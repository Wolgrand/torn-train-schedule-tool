<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Optimizer PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>

<style>
:root {
--bg:#0f1115;
--card:#1a1f2b;
--accent:#5da8ff;
--text:#e6e9ef;
--muted:#9aa4b2;
--success:#4cd964;
--danger:#ff5d5d;
}

body {
margin:0;
font-family:-apple-system;
background:var(--bg);
color:var(--text);
display:flex;
justify-content:center;
}

.container { max-width:560px; padding:16px; }

h1 { text-align:center; }

input,button {
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-bottom:10px;
background:var(--card);
color:white;
}

button { background:var(--accent); }

.input-group { position:relative; }

.toggle {
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:12px;
color:var(--muted);
}

.card {
background:var(--card);
padding:14px;
border-radius:12px;
margin-top:10px;
}

.row {
display:flex;
justify-content:space-between;
padding:5px 0;
}

.timeline {
position:relative;
padding-left:25px;
}
.timeline::before {
content:"";
position:absolute;
left:10px;
top:0;
bottom:0;
width:2px;
background:var(--accent);
}

.item { margin-bottom:14px; position:relative; }
.dot {
position:absolute;
left:-3px;
top:3px;
width:12px;
height:12px;
border-radius:50%;
border:2px solid var(--accent);
}

.content { padding-left:15px; font-size:13px; }

.jump { color:var(--success); }
.xanax { color:var(--accent); }
.wait { color:#ffaa00; }
.waste { color:var(--danger); }

.error {
background:#ff5d5d20;
padding:10px;
border-radius:8px;
margin-top:10px;
color:#ff5d5d;
font-size:13px;
}

</style>
</head>

<body>

<div class="container">

<h1>Gym Optimizer PRO</h1>

<div class="input-group">
<input id="apiKey" type="password" placeholder="API Key">
<span class="toggle" onclick="toggleKey()">Show</span>
</div>

<input id="sleepStart" type="number" value="0">
<input id="sleepEnd" type="number" value="8">

<button onclick="load()">Optimize</button>

<div id="errorBox" class="error" style="display:none"></div>

<div id="card" class="card" style="display:none">

<div class="row"><span>Energy</span><span id="energy"></span></div>
<div class="row"><span>Strategy</span><span id="strategy"></span></div>
<div class="row"><span>Next Jump</span><span id="jump"></span></div>

<h3>Timeline</h3>
<div id="timeline" class="timeline"></div>

<h3>Chart</h3>
<canvas id="chart"></canvas>

</div>

</div>

<script>

const MAX=1000, X=250, CD=480*60;
let dataStore, chart;

// toggle key
function toggleKey(){
apiKey.type = apiKey.type==="password" ? "text" : "password";
}

// helpers
function date(t){ return new Date(t).toLocaleTimeString(); }

function inSleep(t){
let h=new Date(t).getHours();
return h>=sleepStart.value && h<sleepEnd.value;
}

function shift(t){
let d=new Date(t);
d.setHours(sleepEnd.value,0,0,0);
return d.getTime();
}

// simulation
function simulate(strategy){

let energy=dataStore.energy;
let time=Date.now();
let steps=[], waste=0;

while(energy<MAX){

let take=true;

if(strategy!=="aggressive"){

let bestWait=0, bestWaste=999;

for(let i=0;i<=3;i++){
let future=energy+i*dataStore.inc;
let raw=future+X;
let w=Math.max(0,raw-MAX);

if(w<bestWaste){
bestWaste=w;
bestWait=i;
}
}

if(bestWait>0){
let waitTime=bestWait*dataStore.int*1000;

if(strategy==="efficient" || waitTime<CD*1000){
take=false;
time+=waitTime;
energy+=bestWait*dataStore.inc;

steps.push({time,type:"wait"});
continue;
}
}
}

// xanax
if(inSleep(time)) time=shift(time);

let raw=energy+X;
let after=Math.min(MAX,raw);
let w=Math.max(0,raw-MAX);

steps.push({time,type:"x",energy:after,waste:w});

energy=after;
waste+=w;
time+=CD*1000;
}

let final=Math.max(time,
Date.now()+dataStore.drug*1000,
Date.now()+dataStore.booster*1000);

return {steps,final,waste,strategy};
}

// calculate
function calculate(){
let res=["aggressive","balanced","efficient"].map(simulate);
res.sort((a,b)=>a.final-b.final || a.waste-b.waste);
return res;
}

// chart
function draw(res){

let datasets=res.map(r=>{
let data=[];
let energy=dataStore.energy, t=Date.now();

data.push({x:t,y:energy});

r.steps.forEach(s=>{
if(s.energy) data.push({x:s.time,y:s.energy});
});

return {
label:r.strategy,
data,
borderWidth:r.strategy==="efficient"?3:1,
borderColor:r.strategy==="aggressive"?"#ff5d5d":r.strategy==="balanced"?"#ffaa00":"#4cd964",
tension:0.3
};
});

if(chart) chart.destroy();

chart=new Chart(chart,{
type:"line",
data:{datasets},
options:{
parsing:false,
plugins:{
zoom:{
zoom:{wheel:{enabled:true},mode:"x"},
pan:{enabled:true,mode:"x"}
},
tooltip:{
callbacks:{
label:(ctx)=>`Energy: ${ctx.parsed.y}`
}
}
},
scales:{
x:{type:"time"},
y:{min:0,max:1000}
}
}
});
}

// UI
function render(){

let res=calculate();
let best=res[0];

energy.textContent=dataStore.energy;
strategy.textContent=best.strategy;
jump.textContent=date(best.final);

// timeline
let html="";
best.steps.forEach(s=>{
html+=`<div class="item"><div class="dot"></div><div class="content">
<b>${date(s.time)}</b>
<div class="${s.type==="x"?"xanax":"wait"}">${s.type==="x"?"💊 Xanax":"⏳ Wait"}</div>
${s.waste?`<div class="waste">⚠ ${s.waste}</div>`:""}
</div></div>`;
});
timeline.innerHTML=html;

draw(res);
}

// FIXED LOAD (VERY IMPORTANT)
async function load(){

errorBox.style.display="none";

let key=apiKey.value.trim();
if(!key){
errorBox.innerText="API key required";
errorBox.style.display="block";
return;
}

let res=await fetch(`https://api.torn.com/user/?selections=cooldowns,energy&key=${key}`);
let d=await res.json();

// ✅ BULLETPROOF CHECKS
if(d.error){
errorBox.innerText="API error: "+d.error.error;
errorBox.style.display="block";
return;
}

if(!d.cooldowns){
errorBox.innerText="Missing cooldowns permission";
errorBox.style.display="block";
return;
}

if(!d.energy || typeof d.energy.current==="undefined"){
errorBox.innerText="Energy data missing (check API permissions)";
errorBox.style.display="block";
return;
}

// ✅ SAFE ASSIGNMENT
dataStore={
energy:d.energy.current,
drug:d.cooldowns.drug||0,
booster:d.cooldowns.booster||0,
inc:d.energy.increment||5,
int:d.energy.interval||600
};

card.style.display="block";
render();
}

</script>

</body>
</html>
