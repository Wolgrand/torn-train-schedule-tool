<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torn Gym Planner</title>

<style>
:root {
--bg:#0f1115;
--card:#1a1f2b;
--accent:#5da8ff;
--text:#e6e9ef;
--muted:#9aa4b2;
--success:#4cd964;
--danger:#ff5d5d;
}

body {
margin:0;
font-family:-apple-system;
background:var(--bg);
color:var(--text);
display:flex;
justify-content:center;
}

.container { max-width:520px; width:100%; padding:16px; }

/* inputs */
input,button {
width:100%;
padding:10px;
margin-bottom:8px;
border:none;
border-radius:10px;
background:var(--card);
color:white;
}
button { background:var(--accent); cursor:pointer; }

/* card */
.card {
background:var(--card);
padding:12px;
border-radius:10px;
margin-top:10px;
}

.item {
display:flex;
justify-content:space-between;
padding:6px 0;
}

.section {
margin-top:12px;
font-size:13px;
color:var(--muted);
}

h4 { margin:12px 0 6px 0; }

/* calendar */
.calendar-item {
background:#222;
padding:8px;
margin:4px 0;
border-radius:6px;
}

/* timeline */
.timeline {
position:relative;
padding-left:30px;
margin-top:10px;
}

.timeline::before {
content:"";
position:absolute;
left:12px;
top:0;
bottom:0;
width:2px;
background:var(--accent);
}

.timeline-item {
position:relative;
margin-bottom:16px;
}

.timeline-dot {
position:absolute;
left:-4px;
top:2px;
width:14px;
height:14px;
border-radius:50%;
border:2px solid var(--accent);
background:var(--bg);
}

.timeline-content {
padding-left:15px;
font-size:13px;
}

.jump { color:var(--success); font-weight:600; }
.xanax { color:var(--accent); }
.waste { color:var(--danger); font-size:12px; }
</style>

</head>

<body>

<div class="container">

<h2>Gym Planner</h2>

<input id="apiKey" placeholder="API Key">

<h4>Sleep Settings</h4>
<input id="sleepStart" type="number" value="0" min="0" max="23">
<input id="sleepEnd" type="number" value="8" min="0" max="23">

<button onclick="load()">Sync</button>

<div id="card" class="card" style="display:none">

<div class="item"><span>Energy</span><span id="energy"></span></div>

<h4>Cooldown Breakdown</h4>

<div class="item"><span>Drug Ready</span><span id="drugCd"></span></div>
<div class="item"><span>Booster Ready</span><span id="boosterCd"></span></div>
<div class="item"><span>Energy Ready (1000)</span><span id="energyReady"></span></div>
<div class="item"><span>Xanax Duration</span><span id="xanaxDuration"></span></div>
<div class="item"><span>Final Jump</span><span id="finalJump"></span></div>

<h4>Scheduler (Calendar)</h4>
<div id="calendar"></div>

<h4>Timeline</h4>
<div id="timeline" class="timeline"></div>

</div>

</div>

<script>

// ===== CONFIG =====
const XANAX_ENERGY = 250;
const MAX_ENERGY = 1000;
const XANAX_CD = 480 * 60;

let dataStore;
let timer;

// ===== HELPERS =====
function date(ts){ return new Date(ts).toLocaleString(); }

function fmt(sec){
let h=Math.floor(sec/3600);
let m=Math.floor((sec%3600)/60);
return `${h}h ${m}m`;
}

function inSleep(ts){
let h=new Date(ts).getHours();
let s=parseInt(sleepStart.value);
let e=parseInt(sleepEnd.value);
return h>=s && h<e;
}

function shift(ts){
let d=new Date(ts);
d.setHours(parseInt(sleepEnd.value),0,0,0);
return d.getTime();
}

// ===== CALCULATE =====
function calculate(){

let now=Date.now();
let energy=dataStore.energy;

let xanaxNeeded=Math.ceil(Math.max(0,1000-energy)/250);

let steps=[];
let currentEnergy=energy;
let nextTime=now;

for(let i=0;i<xanaxNeeded;i++){

if(inSleep(nextTime)) nextTime=shift(nextTime);

let raw=currentEnergy+250;
let after=Math.min(1000,raw);
let waste=Math.max(0,raw-1000);

steps.push({time:nextTime,before:currentEnergy,after,waste});

currentEnergy=after;
nextTime+=XANAX_CD*1000;
}

let energyReady = steps.length ? steps.at(-1).time : now;
let xanaxDuration = steps.length>1 ? (steps.length-1)*XANAX_CD : 0;

let drugReady = now + dataStore.drug*1000;
let boosterReady = now + dataStore.booster*1000;

let final = Math.max(drugReady, boosterReady, energyReady);

return {steps, energyReady, xanaxDuration, final, drugReady, boosterReady};
}

// ===== UI RENDER =====
function render(){

let calc=calculate();

energy.textContent=dataStore.energy;

drugCd.textContent=date(calc.drugReady);
boosterCd.textContent=date(calc.boosterReady);
energyReady.textContent=date(calc.energyReady);
xanaxDuration.textContent=fmt(calc.xanaxDuration);
finalJump.textContent=date(calc.final);

// ===== CALENDAR VIEW =====
let calHTML="";
let base=calc.final;

for(let i=0;i<3;i++){

calHTML+=`<div class="calendar-item">🏋️ Jump ${i+1}: ${date(base)}</div>`;

calc.steps.forEach(s=>{
calHTML+=`<div class="calendar-item">💊 Xanax: ${date(s.time)}</div>`;
});

base+=24*60*60*1000;
}

calendar.innerHTML=calHTML;

// ===== TIMELINE VIEW =====
let events=[];

// xanax
calc.steps.forEach((s,i)=>{
events.push({
time:s.time,
type:"xanax",
text:`💊 Xanax #${i+1} (${s.before}→${s.after})`,
waste:s.waste
});
});

// jumps
let jumpTime=calc.final;
for(let i=0;i<3;i++){
events.push({
time:jumpTime,
type:"jump",
text:`🏋️ Jump ${i+1}`
});
jumpTime+=86400000;
}

// sort
events.sort((a,b)=>a.time-b.time);

// render timeline
let html="";

events.forEach(ev=>{
html+=`
<div class="timeline-item">
<div class="timeline-dot"></div>
<div class="timeline-content">

<div><b>${date(ev.time)}</b></div>

<div class="${ev.type==='jump'?'jump':'xanax'}">
${ev.text}
</div>

${ev.waste>0?`<div class="waste">⚠️ Waste: ${ev.waste}</div>`:""}

</div>
</div>
`;
});

timeline.innerHTML=html;
}

// ===== LOOP =====
function start(){
clearInterval(timer);

timer=setInterval(()=>{
if(dataStore.drug>0) dataStore.drug--;
if(dataStore.booster>0) dataStore.booster--;
render();
},1000);
}

// ===== LOAD =====
async function load(){

let key=apiKey.value;

let res=await fetch(`https://api.torn.com/user/?selections=cooldowns,energy&key=${key}`);
let d=await res.json();

dataStore={
energy:d.energy.current,
drug:d.cooldowns.drug,
booster:d.cooldowns.booster
};

card.style.display="block";

render();
start();
}

</script>

</body>
</html>
