<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torn Gym Optimizer</title>

<style>
:root {
--bg:#0f1115;
--card:#1a1f2b;
--accent:#5da8ff;
--text:#e6e9ef;
--muted:#9aa4b2;
--success:#4cd964;
--danger:#ff5d5d;
}

body {
margin:0;
font-family:-apple-system,system-ui;
background:var(--bg);
color:var(--text);
display:flex;
justify-content:center;
}

.container {
width:100%;
max-width:520px;
padding:18px;
}

/* HEADER */
h1 {
text-align:center;
font-size:22px;
margin-bottom:10px;
}

/* INPUT */
.input-group {
position:relative;
}

input {
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:var(--card);
color:white;
margin-bottom:10px;
}

.toggle {
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
font-size:12px;
color:var(--muted);
cursor:pointer;
}

button {
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:var(--accent);
color:white;
font-weight:600;
cursor:pointer;
}

/* CARD */
.card {
background:var(--card);
border-radius:14px;
padding:16px;
margin-top:14px;
}

/* ROW */
.row {
display:flex;
justify-content:space-between;
padding:6px 0;
}

/* SECTION */
.section {
margin-top:16px;
}

/* CALENDAR */
.event {
background:#222;
padding:8px;
border-radius:8px;
margin-bottom:6px;
font-size:13px;
}

/* TIMELINE */
.timeline {
position:relative;
padding-left:28px;
margin-top:10px;
}

.timeline::before {
content:'';
position:absolute;
left:10px;
top:0;
bottom:0;
width:2px;
background:var(--accent);
}

.item {
margin-bottom:18px;
position:relative;
}

.dot {
position:absolute;
left:-4px;
top:4px;
width:14px;
height:14px;
border-radius:50%;
border:2px solid var(--accent);
background:var(--bg);
}

.content {
font-size:13px;
padding-left:14px;
}

.jump {color:var(--success); font-weight:600;}
.xanax {color:var(--accent);}
.waste {color:var(--danger); font-size:12px;}
.strategy {color:var(--muted); font-size:12px; text-align:right;}

</style>
</head>

<body>

<div class="container">

<h1>Gym Optimizer</h1>

<div class="input-group">
<input id="apiKey" type="password" placeholder="Torn API Key">
<span class="toggle" onclick="toggleKey()">Show</span>
</div>

<input id="sleepStart" type="number" value="0" min="0" max="23" placeholder="Sleep start">
<input id="sleepEnd" type="number" value="8" min="0" max="23" placeholder="Wake hour">

<button onclick="load()">Optimize</button>

<div id="card" class="card" style="display:none">

<div class="row"><span>Energy</span><span id="energy"></span></div>

<div class="section">
<div class="row"><span>Drug Ready</span><span id="drugCd"></span></div>
<div class="row"><span>Booster Ready</span><span id="boosterCd"></span></div>
<div class="row"><span>Energy Ready</span><span id="energyReady"></span></div>
<div class="row"><span>Final Jump</span><span id="finalJump"></span></div>
</div>

<div class="strategy" id="strategy"></div>

<div class="section">
<b>Scheduler</b>
<div id="calendar"></div>
</div>

<div class="section">
<b>Timeline</b>
<div id="timeline" class="timeline"></div>
</div>

</div>

</div>

<script>

const XANAX_ENERGY = 250;
const MAX_ENERGY = 1000;
const XANAX_CD = 480 * 60;

let dataStore;
let timer;

// toggle API key visibility
function toggleKey(){
let input = document.getElementById("apiKey");
let toggle = document.querySelector(".toggle");

if(input.type === "password"){
input.type = "text";
toggle.textContent = "Hide";
}else{
input.type = "password";
toggle.textContent = "Show";
}
}

// helpers
function date(ts){ return new Date(ts).toLocaleString(); }

function inSleep(ts){
let h = new Date(ts).getHours();
return h >= sleepStart.value && h < sleepEnd.value;
}

function shift(ts){
let d = new Date(ts);
d.setHours(sleepEnd.value,0,0,0);
return d.getTime();
}

// ===== SIMULATION ENGINE =====
function simulate(strategy){

let now = Date.now();
let currentEnergy = dataStore.energy;
let currentTime = now;

let steps=[];
let waste=0;

while(currentEnergy < MAX_ENERGY){

let takeNow = true;

if(strategy !== "aggressive"){

let bestWait=0;
let bestWaste=9999;

for(let i=0;i<=3;i++){
let futureEnergy = currentEnergy + (i * dataStore.increment);
let raw = futureEnergy + 250;
let w = Math.max(0, raw - 1000);

if(w < bestWaste){
bestWaste = w;
bestWait = i;
}
}

if(bestWait > 0){

let waitTime = bestWait * dataStore.interval * 1000;

if(strategy === "efficient" || waitTime < XANAX_CD*1000){
takeNow = false;

currentTime += waitTime;
currentEnergy += bestWait * dataStore.increment;
continue;
}
}
}

// take xanax
if(inSleep(currentTime)){
currentTime = shift(currentTime);
}

let raw = currentEnergy + 250;
let after = Math.min(1000, raw);
let w = Math.max(0, raw - 1000);

steps.push({
time: currentTime,
before: currentEnergy,
after,
waste: w
});

waste += w;
currentEnergy = after;
currentTime += XANAX_CD * 1000;
}

let energyReady = steps.length ? steps.at(-1).time : now;
let final = Math.max(
energyReady,
now + dataStore.drug*1000,
now + dataStore.booster*1000
);

return {steps, final, energyReady, waste, strategy};
}

// ===== OPTIMIZER =====
function calculate(){

let strategies = ["aggressive","balanced","efficient"];

let results = strategies.map(simulate);

results.sort((a,b)=>{
if(a.final !== b.final) return a.final - b.final;
if(a.waste !== b.waste) return a.waste - b.waste;
return a.steps.length - b.steps.length;
});

let best = results[0];

best.drugReady = Date.now() + dataStore.drug*1000;
best.boosterReady = Date.now() + dataStore.booster*1000;

return best;
}

// ===== UI =====
function render(){

let calc = calculate();

energy.textContent = dataStore.energy;
drugCd.textContent = date(calc.drugReady);
boosterCd.textContent = date(calc.boosterReady);
energyReady.textContent = date(calc.energyReady);
finalJump.textContent = date(calc.final);
strategy.textContent = "Strategy: " + calc.strategy;

// CALENDAR
let calHTML="";
let base = calc.final;

for(let i=0;i<3;i++){
calHTML += `<div class="event">🏋️ Jump ${i+1}: ${date(base)}</div>`;
calc.steps.forEach(s=>{
calHTML += `<div class="event">💊 ${date(s.time)}</div>`;
});
base += 86400000;
}

calendar.innerHTML = calHTML;

// TIMELINE
let events=[];

calc.steps.forEach((s,i)=>{
events.push({time:s.time,type:"x",text:`💊 Xanax ${i+1}`,waste:s.waste});
});

let jt=calc.final;
for(let i=0;i<3;i++){
events.push({time:jt,type:"j",text:`Jump ${i+1}`});
jt+=86400000;
}

events.sort((a,b)=>a.time-b.time);

let html="";
events.forEach(e=>{
html+=`
<div class="item">
<div class="dot"></div>
<div class="content">
<b>${date(e.time)}</b>
<div class="${e.type==='j'?'jump':'xanax'}">${e.text}</div>
${e.waste>0?`<div class="waste">⚠️ Waste ${e.waste}</div>`:""}
</div>
</div>`;
});

timeline.innerHTML = html;

}

// loop
function start(){
clearInterval(timer);
timer=setInterval(()=>{
if(dataStore.drug>0) dataStore.drug--;
if(dataStore.booster>0) dataStore.booster--;
render();
},1000);
}

// load
async function load(){

let key = apiKey.value.trim();
if(!key){ alert("API key required"); return; }

let res = await fetch(`https://api.torn.com/user/?selections=cooldowns,energy&key=${key}`);
let d = await res.json();

dataStore = {
energy: d.energy.current,
drug: d.cooldowns.drug,
booster: d.cooldowns.booster,
increment: d.energy.increment,
interval: d.energy.interval
};

card.style.display="block";

render();
start();
}
</script>

</body>
</html>
