<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torn Gym Planner</title>

<style>
:root {
--bg:#0f1115;
--card:#1a1f2b;
--accent:#5da8ff;
--text:#e6e9ef;
--muted:#9aa4b2;
--success:#4cd964;
--danger:#ff5d5d;
}

body {
margin:0;
background:var(--bg);
color:var(--text);
font-family:-apple-system;
}

.container { max-width:900px; margin:auto; padding:16px; }

input,button {
width:100%;
padding:10px;
margin-bottom:6px;
border-radius:8px;
border:none;
background:#1a1f2b;
color:white;
}

button { background:var(--accent); cursor:pointer; }

.card {
background:var(--card);
padding:10px;
border-radius:10px;
margin-top:10px;
}

/* ===== TIMELINE ===== */
.timeline-wrap {
overflow-x:auto;
margin-top:10px;
}

.timeline {
position:relative;
height:140px;
min-width:1200px;
background:#111;
border-radius:10px;
}

.time-axis {
position:absolute;
top:0;
left:0;
width:100%;
height:30px;
font-size:11px;
color:#9aa4b2;
display:flex;
}

.time-axis div {
flex:1;
text-align:center;
border-left:1px solid #222;
}

/* events */
.event {
position:absolute;
height:40px;
top:60px;
border-radius:6px;
padding:3px;
font-size:11px;
white-space:nowrap;
cursor:pointer;
}

.xanax { background:#5da8ff; }
.jump { background:#4cd964; }
.now { background:#ff5d5d; height:100%; width:2px; }

/* hover */
.event:hover {
transform:scale(1.05);
}

/* sleep overlay */
.sleep {
position:absolute;
top:0;
height:100%;
background:rgba(0,0,0,0.4);
}
</style>

</head>

<body>

<div class="container">

<h2>Gym Planner</h2>

<input id="apiKey" placeholder="API Key">

<h4>Sleep Settings</h4>
<input id="sleepStart" type="number" value="0">
<input id="sleepEnd" type="number" value="8">

<button onclick="load()">Sync</button>

<div id="card" class="card" style="display:none">

<h3>Interactive Timeline</h3>
<div class="timeline-wrap">
<div class="timeline" id="timeline"></div>
</div>

</div>

</div>

<script>

const XANAX_CD = 480 * 60 * 1000;
const XANAX_ENERGY = 250;

let dataStore;
let pxPerHour = 50;

// helpers
function inSleep(ts){
let h=new Date(ts).getHours();
let s=+sleepStart.value;
let e=+sleepEnd.value;
return h>=s && h<e;
}

function shift(ts){
let d=new Date(ts);
d.setHours(sleepEnd.value,0,0,0);
return d.getTime();
}

// core calculation
function calculate(){

let now=Date.now();
let energy=dataStore.energy;

let need=Math.max(0,1000-energy);
let xanax=Math.ceil(need/250);

let steps=[];
let currentEnergy=energy;
let t=now;

for(let i=0;i<xanax;i++){

if(inSleep(t)) t=shift(t);

let raw=currentEnergy+250;
let waste=Math.max(0,raw-1000);
let after=Math.min(1000,raw);

steps.push({time:t,waste,i});

currentEnergy=after;
t+=XANAX_CD;
}

let final=t;

return {steps,final};
}

// render timeline
function renderTimeline(){

let container=document.getElementById("timeline");
container.innerHTML="";

let calc=calculate();

let start=Date.now();
let end=calc.final + 3*86400000;

let totalHours=(end-start)/3600000;
container.style.minWidth = (totalHours * pxPerHour) + "px";

// axis
let axis=document.createElement("div");
axis.className="time-axis";

for(let i=0;i<totalHours;i+=4){

let d=new Date(start + i*3600000);
let el=document.createElement("div");
el.innerText = d.getHours()+":00";
axis.appendChild(el);
}

container.appendChild(axis);

// sleep blocks
for(let t=start; t<end; t+=86400000){

let sleepStartTs = new Date(t);
sleepStartTs.setHours(sleepStart.value,0,0,0);

let sleepEndTs = new Date(t);
sleepEndTs.setHours(sleepEnd.value,0,0,0);

let left=((sleepStartTs-start)/3600000)*pxPerHour;
let width=((sleepEndTs-sleepStartTs)/3600000)*pxPerHour;

let div=document.createElement("div");
div.className="sleep";
div.style.left=left+"px";
div.style.width=width+"px";

container.appendChild(div);
}

// now marker
let nowLine=document.createElement("div");
nowLine.className="event now";
nowLine.style.left="0px";
container.appendChild(nowLine);

// xanax events
calc.steps.forEach(s=>{
let e=document.createElement("div");

e.className="event xanax";
let left=((s.time-start)/3600000)*pxPerHour;

e.style.left=left+"px";
e.style.width="60px";
e.innerText=`💊 #${s.i+1}`;

if(s.waste>0){
e.style.background="#ff5d5d";
e.title="Waste: "+s.waste;
}

container.appendChild(e);
});

// jumps (3)
let jump=calc.final;
for(let i=0;i<3;i++){

let e=document.createElement("div");
e.className="event jump";

let left=((jump-start)/3600000)*pxPerHour;

e.style.left=left+"px";
e.style.width="70px";
e.innerText="🏋️ Jump";

container.appendChild(e);

jump+=86400000;
}

}

// loop
function start(){
clearInterval(window.t);
window.t=setInterval(renderTimeline,1000);
}

// load API
async function load(){

let key=apiKey.value;

let res=await fetch(`https://api.torn.com/user/?selections=cooldowns,energy&key=${key}`);
let d=await res.json();

dataStore={
energy:d.energy.current
};

card.style.display="block";

renderTimeline();
start();
}

</script>

</body>
</html>
